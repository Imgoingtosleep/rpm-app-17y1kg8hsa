map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP REVERSE PROXY: Port 8000 -> Services with /rpm/8000 Subpath
server {
    listen 8000;
    listen [::]:8000;
    server_name _ 10.1.10.124 localhost;

    # รองรับการอัปโหลดไฟล์ขนาดใหญ่ (รูปภาพ/เอกสาร)
    client_max_body_size 100M;

    # Headers ส่งต่อข้อมูล Client
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /rpm/8000;

    # Timeout
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --- 1) NextAuth Authentication API (handled by Next.js frontend) ---
    location ~ ^/(rpm/8000/)?api/auth/(session|csrf|providers|signin|callback|signout|error) {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 2) Backend Node.js API (strip /rpm/8000/ prefix -> backend receives /api/) ---
    location /rpm/8000/api/ {
        proxy_pass http://backend:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://backend:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 3) Uploaded Media / Storage (strip /rpm/8000/ prefix -> backend receives /storage/) ---
    location /rpm/8000/storage/ {
        proxy_pass http://backend:8050/storage/;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    location /storage/ {
        proxy_pass http://backend:8050/storage/;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 4) Redirect root to /rpm/8000 ---
    location = / {
        return 301 /rpm/8000;
    }

    # --- 5) Frontend Web App (Next.js with basePath: /rpm/8000) ---
    location /rpm/8000 {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # Fallback for direct port 8000 access
    location / {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
