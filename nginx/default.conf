map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP REVERSE PROXY: Port 8000 -> Services
server {
    listen 8000;
    listen [::]:8000;
    server_name _ 10.1.10.124 localhost;

    # รองรับการอัปโหลดไฟล์ขนาดใหญ่ (รูปภาพ/เอกสาร)
    client_max_body_size 100M;

    # Headers ส่งต่อข้อมูล Client
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 8000;

    # Timeout
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --- 1) Frontend Web App (Next.js / Vite) ---
    location / {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 2) Backend Node.js API ---
    location /api/ {
        proxy_pass http://backend:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 3) Uploaded Media / Storage ---
    location /storage/ {
        proxy_pass http://backend:8050/storage/;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. HTTPS REVERSE PROXY: Port 8443 (SSL) -> Services
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _ 10.1.10.124 localhost;

    # SSL Certificate
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # รองรับการอัปโหลดไฟล์ขนาดใหญ่ (รูปภาพ/เอกสาร)
    client_max_body_size 100M;

    # Headers ส่งต่อข้อมูล Client
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 8443;

    # Timeout
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --- 1) Frontend Web App (Next.js / Vite) ---
    location / {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 2) Backend Node.js API ---
    location /api/ {
        proxy_pass http://backend:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 3) Uploaded Media / Storage ---
    location /storage/ {
        proxy_pass http://backend:8050/storage/;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }
}
