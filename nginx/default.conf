map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP REVERSE PROXY: Port 80 & Port 8000 -> Services
server {
    listen 80;
    listen [::]:80;
    listen 8000;
    listen [::]:8000;
    server_name _ 10.1.10.124 localhost;

    # รองรับการอัปโหลดไฟล์ขนาดใหญ่ (รูปภาพ/เอกสาร)
    client_max_body_size 100M;

    # Headers ส่งต่อข้อมูล Client
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeout
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --- 1) NextAuth Authentication API (handled by Frontend) ---
    location ~ ^/(rpm/8000/)?api/auth/(session|csrf|providers|signin|callback|signout|error) {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 2) Backend Node.js API ---
    location /rpm/8000/api/ {
        proxy_pass http://backend:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://backend:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 3) Uploaded Media / Storage ---
    location /rpm/8000/storage/ {
        proxy_pass http://backend:8050/storage/;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    location /storage/ {
        proxy_pass http://backend:8050/storage/;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 4) Frontend Web App (Next.js) ---
    location = / {
        return 302 /rpm/8000;
    }

    location /rpm/8000 {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://frontend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    location = /network-management/8100 {
        return 301 /network-management/8100/;
    }

    location /network-management/8100/ {
         proxy_pass http://10.1.10.124:8100/network-management/8100/;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
         proxy_set_header Host $host;
    }

    location = /deploy-config/8200 {
        return 301 /deploy-config/8200/;
    }

    location /deploy-config/8200/ {
         proxy_pass http://10.1.10.124:8200/deploy-config/8200/;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
         proxy_set_header Host $host;
     }
}
