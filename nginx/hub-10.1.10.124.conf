# ==============================================================================
# Nginx Configuration for Hub Server (10.1.10.124)
# Project: RPM App (Routes via subpath /rpm/8000 to local port 8000)
#
# URL ใช้งาน: http://10.1.10.124/rpm/8000
# ==============================================================================
#
# วิธีติดตั้งบนเครื่อง 10.1.10.124:
#
# กรณีที่ 1: เครื่อง 10.1.10.124 มีโฟลเดอร์ /etc/nginx/conf.d/
#   1. คัดลอกไฟล์นี้ไปวางที่เครื่อง Hub:
#      sudo cp nginx/hub-10.1.10.124.conf /etc/nginx/conf.d/rpm.conf
#   2. ตรวจสอบ syntax:
#      sudo nginx -t
#   3. รีโหลด Nginx:
#      sudo systemctl reload nginx
#
# กรณีที่ 2: มี server block (listen 80) หลักอยู่แล้ว (เช่นใน /etc/nginx/nginx.conf หรือ sites-available/default)
#   ให้นำเฉพาะบล็อก location ด้านล่างไปวางไว้ใน server { ... } นั้น:
#
#       location /rpm/8000 {
#           proxy_pass http://127.0.0.1:8000;
#           proxy_http_version 1.1;
#           proxy_set_header Upgrade $http_upgrade;
#           proxy_set_header Connection $connection_upgrade;
#           proxy_set_header Host $host;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_set_header X-Forwarded-Host $host;
#           proxy_set_header X-Forwarded-Port $server_port;
#           proxy_set_header X-Forwarded-Prefix /rpm/8000;
#           proxy_read_timeout 300s;
#           proxy_send_timeout 300s;
#           proxy_connect_timeout 300s;
#           client_max_body_size 100M;
#       }
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 10.1.10.124 localhost;

    # รองรับการอัปโหลดไฟล์ขนาดใหญ่ (รูปภาพหน้างาน / PDF)
    client_max_body_size 100M;

    # Reverse Proxy ไปยัง Docker container ของ rpm-app ที่พอร์ต 8000
    # รองรับทั้ง http://10.1.10.124/rpm/8000 และ http://10.1.10.124/rpm/8000/
    location /rpm/8000 {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers ข้อมูล Client & Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /rpm/8000;

        # Timeouts สำหรับงานอัปโหลด/ดาวน์โหลดไฟล์ขนาดใหญ่
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}
