version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rpm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123'
      POSTGRES_DB: rpm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-node/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: rpm-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rpm.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: rpm-backend
    restart: always
    depends_on:
      - db
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:123@db:5432/rpm_db
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpm-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "1000:1000"

volumes:
  postgres_data:
  pgadmin_data:
