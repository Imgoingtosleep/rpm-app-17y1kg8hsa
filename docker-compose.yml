services:
  db:
    image: postgres:15-alpine
    container_name: rpm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_EXTERNAL:-8432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-node/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: rpm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8055:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: rpm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=${BACKEND_PORT:-8050}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - SINGLE_VIEW_API_URL=${SINGLE_VIEW_API_URL:-http://10.1.10.200}
      - SINGLE_VIEW_APP_NAME=${SINGLE_VIEW_APP_NAME:-Noc Tools}
      - SINGLE_VIEW_TIMEOUT_MS=${SINGLE_VIEW_TIMEOUT_MS:-10000}
      - SINGLE_VIEW_EMAIL_DOMAIN=${SINGLE_VIEW_EMAIL_DOMAIN:-rpm.com}
    ports:
      - "${BACKEND_PORT:-8050}:${BACKEND_PORT:-8050}"
    volumes:
      - ${STORAGE_PATH:-./storage}:/app/storage
      - ./backend-node/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rpm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - PORT=${FRONTEND_PORT:-8001}
      - NODE_ENV=${NODE_ENV}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-rpm-secure-auth-secret-key-9988}
      - AUTH_TRUST_HOST=true
      - SHARED_JWT_SECRET=${JWT_SECRET:-netops-secure-token-signing-key-7892}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${VITE_GOOGLE_CLIENT_ID}}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8001}:${FRONTEND_PORT:-8001}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  nginx:
    image: nginx:alpine
    container_name: rpm-nginx
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
        
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
  frontend_next:
